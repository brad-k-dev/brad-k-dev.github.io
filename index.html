<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brad Kim Games</title>
<style>
:root { --bg: #fff8f1; --card: #ffffff; --ink: #4a383d; --soft: #8a7479; --pink: #ff7894; --line: #f1e2da; }
@media (prefers-color-scheme: dark) { :root { --bg: #221b1d; --card: #2d2427; --ink: #f4e9ec; --soft: #bfaab0; --pink: #ff8fa6; --line: #3d3135; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 40px 16px 64px; }
h1 { text-align: center; font-size: 28px; margin: 0 0 4px; }
.sub { text-align: center; color: var(--soft); margin: 0 0 28px; }
.app { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px 22px; margin: 14px 0; color: inherit; text-decoration: none; }
.app h2 { font-size: 20px; margin: 0; }
.app p { margin: 4px 0 10px; color: var(--soft); }
.links a { color: var(--pink); margin-right: 14px; font-size: 15px; }
footer { text-align: center; color: var(--soft); font-size: 14px; margin-top: 40px; }
</style>
</head>
<body>
<main>
  <h1>Brad Kim Games</h1>
  <p class="sub">작고 귀여운 모바일 게임을 만듭니다</p>
  <div class="app">
    <h2>🐾 쏙! 냥이 (Squish Cats)</h2>
    <p>톡 치면 쏙! 냥이들을 같은 색 바구니로 보내는 귀여운 퍼즐 게임</p>
    <div class="links">
      <a href="/Squish-cats/">소개</a>
      <a href="/Squish-cats/privacy.html">개인정보처리방침</a>
      <a href="https://github.com/brad-k-dev/Squish-cats/issues">문의</a>
    </div>
  </div>
  <footer>© 2026 Brad Kim</footer>
</main>
</body>
</html>
